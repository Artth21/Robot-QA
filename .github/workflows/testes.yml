name: Testes automatizados

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1-5" # dias úteis, 08:00 em Brasília

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar Node (para subir o ServeRest local)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Subir ServeRest local
        run: |
          npx -y serverest@latest > serverest.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/usuarios > /dev/null && echo "ServeRest no ar" && exit 0
            sleep 2
          done
          cat serverest.log
          exit 1

      - name: Testes de API (ServeRest local)
        run: >
          robot --name API
          -v BASE_URL:http://localhost:3000
          -d results/api
          tests/api

      - name: Testes Web (ServeRest Front público, Chrome headless)
        if: always()
        run: >
          robot --name Web
          -v HEADLESS:True
          -d results/web
          tests/web

      - name: Unificar relatórios
        if: always()
        run: >
          rebot --name "ServeRest QA"
          -d results
          --output output.xml
          results/api/output.xml results/web/output.xml

      - name: Guardar relatórios da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-robot
          path: results

      - name: Preparar relatório para o GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/web
          cp results/report.html site/index.html
          cp results/log.html site/log.html
          cp results/web/*.png site/web/ 2>/dev/null || true

      - name: Enviar relatório para o GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar-relatorio:
    if: always() && github.ref == 'refs/heads/main'
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
